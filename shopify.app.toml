# Learn more about configuring your app at [https://shopify.dev/docs/apps/tools/cli/configuration](https://shopify.dev/docs/apps/tools/cli/configuration)

client_id = "72c63ce02e7da1645b5de98cbc6f2b44"
name = "ConfettiFlow"
application_url = "https://confetti-flow.vercel.app"  
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "write_products"

[auth]
redirect_urls = [ "https://confetti-maker.vercel.app/auth/callback" ]  # ← Also check this is correct
